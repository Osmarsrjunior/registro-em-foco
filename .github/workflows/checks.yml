name: Verificar dados e publicações
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_data.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- data/processed data/sources.json dist/data.js dist/territories.csv dist/municipalities_2024.csv dist/groups_2024.csv
